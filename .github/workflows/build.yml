name: Build Magisk Module

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Android NDK
      id: setup-ndk
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r21e

    - name: Download Zygisk Header
      run: |
        curl -L -o zygisk.hpp https://raw.githubusercontent.com/topjohnwu/zygisk-module-sample/master/module/jni/zygisk.hpp
        mv zygisk.hpp module/jni/

    - name: Download And64InlineHook
      run: |
        curl -L -o And64InlineHook.hpp https://raw.githubusercontent.com/Rprop/And64InlineHook/master/And64InlineHook.hpp
        curl -L -o And64InlineHook.cpp https://raw.githubusercontent.com/Rprop/And64InlineHook/master/And64InlineHook.cpp
        mv And64InlineHook.hpp module/jni/
        mv And64InlineHook.cpp module/jni/

    - name: Build Module with CMake
      run: |
        cd module/jni
        cmake -B build \
          -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-28 \
          -DCMAKE_BUILD_TYPE=Release
        cmake --build build -j$(nproc)

    - name: Package Magisk Zip
      run: |
        mkdir -p out/zygisk/arm64-v8a
        # Copy the compiled shared library
        cp module/jni/build/libmtk_spoof.so out/zygisk/arm64-v8a.so
        cp module/module.prop out/
        cp module/customize.sh out/
        cd out
        zip -r9 ../MtkToSnapdragon-v1.1.zip .

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MtkToSnapdragon-Magisk-Module
        path: MtkToSnapdragon-v1.1.zip
