name: Build Magisk Module

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r26b

    - name: Download Zygisk Header
      run: |
        curl -L -o zygisk.hpp https://raw.githubusercontent.com/topjohnwu/zygisk-module-sample/master/module/jni/zygisk.hpp
        mv zygisk.hpp module/jni/

    - name: Download Dobby
      run: |
        git clone https://github.com/jmpews/Dobby.git module/jni/dobby

    - name: Build Module with CMake
      run: |
        cd module/jni
        cmake -B build \
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-28 \
          -DCMAKE_BUILD_TYPE=Release
        cmake --build build -j$(nproc)

    - name: Package Magisk Zip
      run: |
        mkdir -p out/zygisk/arm64-v8a
        # Copy the compiled shared library
        cp module/jni/build/libmtk_spoof.so out/zygisk/arm64-v8a.so
        cp module/module.prop out/
        cp module/customize.sh out/
        cd out
        zip -r9 ../MtkToSnapdragon-v1.1.zip .

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MtkToSnapdragon-Magisk-Module
        path: MtkToSnapdragon-v1.1.zip
